<!-- src/app/components/navbar/navbar.component.html -->
<nav class="app-nav">
    <div class="app-nav-inner">

        <a class="app-nav-brand" routerLink="/">
            Sage<span>.</span>
        </a>

        <!-- Desktop links -->
        <div class="app-nav-links-desktop">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                {{ current.home }}
            </a>
            <a routerLink="/about" routerLinkActive="active">
                {{ current.about }}
            </a>
            <a routerLink="/services" routerLinkActive="active">
                {{ current.services }}
            </a>
            <a routerLink="/projects" routerLinkActive="active">
                {{ current.projects }}
            </a>
            <a routerLink="/experience" routerLinkActive="active">
                {{ current.experience }}
            </a>
            <a routerLink="/contact" routerLinkActive="active">
                {{ current.contact }}
            </a>

            <button type="button" class="nav-lang-toggle" (click)="toggleLang()">
                {{ lang === 'en' ? 'NL' : 'EN' }}
            </button>
        </div>

        <!-- Mobile toggle -->
        <button class="app-nav-toggle" type="button" (click)="openOffcanvas()" aria-label="Toggle navigation"
            [attr.aria-expanded]="isOpen">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>
</nav>

<!-- Mobile offcanvas overlay -->
<div class="offcanvas-overlay" [class.offcanvas-overlay--open]="isOpen" (click)="closeOffcanvas()"></div>

<!-- Mobile offcanvas panel -->
<div class="offcanvas-panel" [class.offcanvas-panel--open]="isOpen" tabindex="-1">
    <div class="offcanvas-header">
        <span class="offcanvas-brand">Sage<span>.</span></span>
        <button type="button" class="offcanvas-close" (click)="closeOffcanvas()" aria-label="Close">
            <span></span>
            <span></span>
        </button>
    </div>
    <div class="offcanvas-body">
        <ul class="offcanvas-nav">
            <li>
                <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeOffcanvas()">
                    {{ current.home }}
                </a>
            </li>
            <li>
                <a routerLink="/about" routerLinkActive="active" (click)="closeOffcanvas()">
                    {{ current.about }}
                </a>
            </li>
            <li>
                <a routerLink="/services" routerLinkActive="active" (click)="closeOffcanvas()">
                    {{ current.services }}
                </a>
            </li>
            <li>
                <a routerLink="/projects" routerLinkActive="active" (click)="closeOffcanvas()">
                    {{ current.projects }}
                </a>
            </li>
            <li>
                <a routerLink="/experience" routerLinkActive="active" (click)="closeOffcanvas()">
                    {{ current.experience }}
                </a>
            </li>
            <li>
                <a routerLink="/contact" routerLinkActive="active" (click)="closeOffcanvas()">
                    {{ current.contact }}
                </a>
            </li>
        </ul>

        <button type="button" class="offcanvas-lang-toggle" (click)="toggleLang()">
            {{ lang === 'en' ? 'NL' : 'EN' }}
        </button>
    </div>
</div>
