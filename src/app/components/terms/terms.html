<section class="legal-page">

    <section class="legal-header fade-up">
        <p class="section-label">{{ current.sectionLabel }}</p>
        <h1 class="legal-title">{{ current.title }}</h1>
        <p class="legal-subtitle">
            {{ current.subtitle }}
        </p>
    </section>

    <section class="legal-section fade-up">
        <h2>{{ current.purposeTitle }}</h2>
        <p>
            {{ current.purposeText }}
        </p>
    </section>

    <section class="legal-section fade-up">
        <h2>{{ current.guaranteesTitle }}</h2>
        <p>
            {{ current.guaranteesText }}
        </p>
    </section>

    <section class="legal-section fade-up">
        <h2>{{ current.ipTitle }}</h2>
        <p>
            {{ current.ipText }}
        </p>
    </section>

    <section class="legal-section fade-up">
        <h2>{{ current.linksTitle }}</h2>
        <p>
            {{ current.linksText }}
        </p>
    </section>

</section>
